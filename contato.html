<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechCode - Contato</title>

</head>

<body>

<header>

    <h1>📩 Entre em contato</h1>

    <nav>

        <a href="index.html">Início</a> |
        <a href="sobre.html">Sobre</a> |
        <a href="cursos.html">Cursos</a> |
        <a href="projetos.html">Projetos</a> |
        <a href="contato.html">Contato</a>

    </nav>

</header>

<hr>

<main>

    <h2>Formulário de contato</h2>

    <form action="#" method="post">

        <fieldset>

            <legend>Dados pessoais</legend>

            <p>

                <label for="nome">
                    Nome:
                </label>

                <br>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

            </p>

            <p>

                <label for="email">
                    E-mail:
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </p>

            <p>

                <label for="telefone">
                    Telefone:
                </label>

                <br>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                >

            </p>

        </fieldset>

        <br>

        <fieldset>

            <legend>Informações</legend>

            <p>

                <label for="assunto">
                    Assunto:
                </label>

                <br>

                <select id="assunto" name="assunto">

                    <option value="">
                        Selecione
                    </option>

                    <option value="curso">
                        Informações sobre cursos
                    </option>

                    <option value="projeto">
                        Projetos
                    </option>

                    <option value="suporte">
                        Suporte
                    </option>

                    <option value="outro">
                        Outro
                    </option>

                </select>

            </p>

            <p>

                <label>
                    Você é:
                </label>

                <br>

                <input
                    type="radio"
                    name="perfil"
                    value="estudante"
                >

                Estudante

                <br>

                <input
                    type="radio"
                    name="perfil"
                    value="profissional"
                >

                Profissional

                <br>

                <input
                    type="radio"
                    name="perfil"
                    value="outro"
                >

                Outro

            </p>

            <p>

                <label>
                    Áreas de interesse:
                </label>

                <br>

                <input
                    type="checkbox"
                    name="interesse"
                    value="html"
                >

                HTML

                <br>

                <input
                    type="checkbox"
                    name="interesse"
                    value="c"
                >

                C

                <br>

                <input
                    type="checkbox"
                    name="interesse"
                    value="python"
                >

                Python

                <br>

                <input
                    type="checkbox"
                    name="interesse"
                    value="banco"
                >

                Banco de Dados

            </p>

            <p>

                <label for="mensagem">
                    Mensagem:
                </label>

                <br>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="8"
                    cols="50"
                    placeholder="Digite sua mensagem"
                ></textarea>

            </p>

        </fieldset>

        <br>

        <button type="submit">
            Enviar formulário
        </button>

        <button type="reset">
            Limpar
        </button>

    </form>

    <hr>

    <h2>Outros contatos</h2>

    <p>
        📧 E-mail:
        <a href="mailto:contato@techcode.com">
            contato@techcode.com
        </a>
    </p>

    <p>
        📱 Telefone:
        <a href="tel:+5583999999999">
            (83) 99999-9999
        </a>
    </p>

</main>

<hr>

<footer>

    <p>© 2026 TechCode</p>

</footer>

</body>

</html>
